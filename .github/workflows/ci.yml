name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.11'
      - run: uv sync --locked --group test
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - run: uv build && uv run twine check dist/*
      - name: Check installed wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" -I -c 'from smolagents_briq import BriqExecutor; from importlib.resources import files; assert files("smolagents_briq").joinpath("_bridge.py").is_file()'
