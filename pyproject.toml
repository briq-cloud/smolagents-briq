[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smolagents-briq"
version = "0.1.0"
description = "Persistent briq sandbox executor for smolagents"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["briq-cloud>=0.1.1,<0.2", "smolagents>=1.26.0,<1.27"]

[project.urls]
Homepage = "https://briq.cloud"
Repository = "https://github.com/briq-cloud/smolagents-briq"

[dependency-groups]
test = ["numpy>=1.26,<3", "pytest>=8", "ipykernel>=6,<8", "jupyter-client>=8,<9", "ruff>=0.6", "build>=1", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["smolagents_briq"]

[tool.hatch.build.targets.sdist]
include = ["smolagents_briq", "tests", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
